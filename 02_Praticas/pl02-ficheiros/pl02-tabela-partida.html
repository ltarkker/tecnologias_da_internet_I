<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabela partida</title>
  <style>table, th, td { border: 1px solid #999; border-collapse: collapse; padding: 6px 10px; }</style>
</head>
<body>
  <table>
    <caption>Entregas das fichas PL</caption>
    <tr>
      <th>Estudante</th>
      <th>PL01</th>
      <th>PL02</th>
    </tr>
    <tr>
      <td>Ana</td>
      <td>Entregue</td>
      <td>Entregue</td>
    </tr>
    <td>Rui</td>
    <tr>
      <td colspan="3">Por entregar</td>
      <td>Entregue</td>
    </tr>
  </table>
</body>
</html>
