<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela corrigida</title>
    <style>
        table, th, td { border: 1px solid #999; border-collapse: collapse; padding: 6px 10px; }
    </style>
</head>
<body>
    <table>
        <caption>Entregas das fichas PL</caption>
        <thead>
            <tr>
                <th scope="col">Estudante</th>
                <th scope="col">PL01</th>
                <th scope="col">PL02</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row">Ana</th>
                <td>Entregue</td>
                <td>Entregue</td>
            </tr>
            <tr>
                <th scope="row">Rui</th>
                <td colspan="2">Por entregar</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
